<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangaVerse - Secure Checkout</title>
    
    <!-- Bootstrap 5 CSS for responsive grid utilities -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts: Bangers (Logo), Oswald (Titles/Nav), Roboto (Body/Form) -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@300;400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/checkout.css">

   
</head>
<body>

    <!-- 1. Navbar (Header) -->
    <nav class="navbar-custom">
        <div class="container">
            <!-- Row 1: Navigation Links (Centered at top) -->
            <div class="d-flex justify-content-center mb-4">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">Browse Manga</a>
                <a href="#" class="nav-link">About us</a>
                <a href="#" class="nav-link">Contact us</a>
            </div>

            <!-- Row 2: Search - Logo - Actions -->
            <div class="d-flex justify-content-between align-items-center">
                
                <!-- Left: Search (Fixed width to ensure Logo centering) -->
                <div class="d-none d-md-block" style="width: 300px;">
                    <div class="search-bar">
                        <i class="fas fa-search text-muted"></i>
                        <input type="text" placeholder='Search "one piece"...'>
                    </div>
                </div>

                <!-- Center: Logo (Now prominent and centered) -->
                <div class="text-center">
                    <div class="manga-logo">MANGAVERSE</div>
                </div>

                <!-- Right: Login & Icons (Fixed width to ensure Logo centering) -->
                <div class="d-flex align-items-center justify-content-end" style="width: 300px;">
                    <button class="btn btn-login me-3">Login</button>
                    <div class="icon-btn"><i class="far fa-heart"></i></div>
                    <div class="icon-btn">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.5rem;">1</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 2. Main Content: Checkout Form -->
    <div class="checkout-container">
        <div class="checkout-form-card">
            <form>
                
                <!-- Personal Details -->
                <div class="section-title">Personal Details</div>
                <div class="row g-4">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName" placeholder="Enter Your First Name...">
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Last name</label>
                        <input type="text" class="form-control" id="lastName" placeholder="Enter Your Last Name...">
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter Your Email...">
                    </div>
                    <div class="col-md-6">
                        <label for="phoneNumber" class="form-label">Phone number</label>
                        <input type="tel" class="form-control" id="phoneNumber" placeholder="Enter Your Phone Number...">
                    </div>
                </div>

                
                <!-- Payment Details -->
                <div class="section-title">Payment Details</div>

                <div class="payment-methods">
                    <span class="payment-method-icon visa-icon">VISA</span>
                    <span class="payment-method-icon stripe-icon">stripe</span>
                    <span class="payment-method-icon paypal-icon">PayPal</span>
                    <span class="payment-method-icon mastercard-icon">Mastercard</span>
                    <span class="payment-method-icon gpay-icon">G Pay</span>
                </div>
                
                <div class="row g-4">
                    <div class="col-md-6">
                        <label for="cardHolderName" class="form-label">Card holder name</label>
                        <input type="text" class="form-control" id="cardHolderName" placeholder="Enter Your First Name...">
                    </div>
                    <div class="col-md-6">
                        <label for="cardNumber" class="form-label">Card number</label>
                        <input type="text" class="form-control" id="cardNumber" placeholder="Enter Your Card Number...">
                    </div>
                    <div class="col-md-6">
                        <label for="cvv" class="form-label">CVV</label>
                        <input type="text" class="form-control" id="cvv" placeholder="Example: 4057">
                    </div>
                    <div class="col-md-6">
                        <label for="expiryDate" class="form-label">Expiration Date</label>
                        <input type="text" class="form-control" id="expiryDate" placeholder="MM/YY">
                    </div>
                </div>


                <!-- Shipping Address -->
                <div class="section-title">Shipping Address</div>
                
                <div class="row g-4">
                    <div class="col-12">
                        <label for="addressLine1" class="form-label">Address line 1</label>
                        <input type="text" class="form-control" id="addressLine1" placeholder="Your Complete Address...">
                    </div>
                    <div class="col-md-6">
                        <label for="city" class="form-label">City</label>
                        <input type="text" class="form-control" id="city" placeholder="Your City...">
                    </div>
                    <div class="col-md-6">
                        <label for="state" class="form-label">State</label>
                        <input type="text" class="form-control" id="state" placeholder="Your State...">
                    </div>
                    
                    <!-- Landmark and Postal Code on the same line -->
                    <div class="col-md-6">
                        <label for="landmark" class="form-label">Landmark</label>
                        <input type="text" class="form-control" id="landmark" placeholder="Any Landmark (Famous Place Or Mall)">
                    </div>
                    <div class="col-md-6">
                        <label for="postalCode" class="form-label">Postal code</label>
                        <input type="text" class="form-control" id="postalCode" placeholder="ZIP Code (1231216)">
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button type="button" class="btn btn-cancel">Cancel</button>
                    <button type="submit" class="btn btn-checkout">Complete Purchase</button>
                </div>

            </form>
        </div>
    </div>
    <!-- End of Checkout Form -->



    <!-- 4. Footer -->
    <footer>
        <div class="container">
            <div class="row align-items-center text-center text-md-start">
                
                <!-- Left: Logo & Copyright -->
                <div class="col-md-4 mb-4 mb-md-0 text-center text-md-start">
                    <div class="footer-logo mb-2">MANGAVERSE</div>
                    <small class="copyright-text">&copy; MANGAVERSE TO ALL RIGHTS RESERVED</small>
                </div>

                <!-- Center: Contact -->
                <div class="col-md-4 mb-4 mb-md-0 text-center">
                    <div class="footer-heading">CONTACT</div>
                    <div class="contact-info">
                        <p >Email</p>
                        <p>support@mangaverse.com</p>
                        <p >Phone</p>
                        <p>+92253135000</p>
                    </div>
                </div>

                <!-- Right: Join Now -->
                <div class="col-md-4 text-center text-md-end">
                    <div class="footer-heading">JOIN NOW</div>
                    <div class="mb-3">
                        <a href="#" class="social-link social-fb"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class="social-link social-insta"><i class="fab fa-instagram"></i></a>
                        <a href="#" class="social-link social-tw"><i class="fab fa-twitter"></i></a>
                        <a href="#" class="social-link social-disc"><i class="fab fa-discord"></i></a>
                    </div>
                    <div class="footer-links bg-white d-inline-block px-3 py-1 rounded text-dark">
                        <a href="#" class="text-dark fw-bold">About us</a> | 
                        <a href="#" class="text-dark">Privacy Policy</a> | 
                        <a href="#" class="text-dark">Terms</a>
                    </div>
                </div>

            </div>
        </div>
    </footer>

</body>
</html>
