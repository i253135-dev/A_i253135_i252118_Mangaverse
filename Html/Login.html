<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../css/login.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <style>
        /* CSS from the next section goes here */
    </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="login-container">
        <div class="login-form-section">
            <h2 class="welcome-heading">WELCOME BACK</h2>
            <p class="welcome-subtext">Welcome back! Please enter your details.</p>

            <form>
                <div class="mb-3">
                    <label for="emailInput" class="form-label-custom">Email</label>
                    <input type="email" class="form-control-custom" id="emailInput" placeholder="Enter your email">
                </div>
                <div class="mb-3">
                    <label for="passwordInput" class="form-label-custom">Password</label>
                    <input type="password" class="form-control-custom" id="passwordInput" placeholder="**********">
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input-custom" type="checkbox" value="" id="rememberMe">
                        <label class="form-check-label-custom" for="rememberMe">
                            Remember me
                        </label>
                    </div>
                    <a href="#" class="forgot-password-link">Forgot password</a>
                </div>
                <button type="submit" class="btn-custom btn-primary-custom w-100 mb-3">Sign in</button>
                <button type="button" class="btn-custom btn-google-custom w-100">
                    <img src="https://img.icons8.com/color/16/000000/google-logo.png" alt="Google logo" class="me-2"> Sign in with Google
                </button>
            </form>

            <p class="signup-text mt-4">
                Don't have an account? <a href="#" class="signup-link">Sign up to free!</a>
            </p>
        </div>

        <div class="login-image-section">
            <img src="https://i.imgur.com/eB3R0d5.png" alt="Anime character" class="decorative-image">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
